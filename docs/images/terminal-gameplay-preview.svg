<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">SS004 Tetris terminal gameplay</title>
  <desc id="description">A ten by twenty Tetris board beside score, next piece, and controls panels.</desc>

  <rect width="1200" height="640" rx="24" fill="#0b0f17"/>
  <rect x="1" y="1" width="1198" height="638" rx="23" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#293241" stroke-width="2"/>
  <circle cx="30" cy="27" r="9" fill="#ff5f57"/>
  <circle cx="58" cy="27" r="9" fill="#febc2e"/>
  <circle cx="86" cy="27" r="9" fill="#28c840"/>
  <text x="600" y="34" text-anchor="middle" fill="#d1d5db" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">SS004-Tetris-01 — tetris</text>

  <!-- The playfield is exactly 10 cells wide and 20 cells high. -->
  <rect x="78" y="88" width="244" height="484" rx="3" fill="#111827" stroke="#d1d5db" stroke-width="4"/>

  <!-- Active T Tetromino. -->
  <g fill="#d946ef">
    <rect x="152" y="186" width="24" height="24"/>
    <rect x="176" y="186" width="24" height="24"/>
    <rect x="200" y="186" width="24" height="24"/>
    <rect x="176" y="210" width="24" height="24"/>
  </g>

  <!-- Locked cells retain the color of their Tetromino type. -->
  <g>
    <g fill="#f97316">
      <rect x="80" y="546" width="24" height="24"/>
      <rect x="80" y="522" width="24" height="24"/>
      <rect x="80" y="498" width="24" height="24"/>
      <rect x="104" y="546" width="24" height="24"/>
    </g>
    <g fill="#facc15">
      <rect x="128" y="546" width="24" height="24"/>
      <rect x="152" y="546" width="24" height="24"/>
      <rect x="128" y="522" width="24" height="24"/>
      <rect x="152" y="522" width="24" height="24"/>
    </g>
    <g fill="#22c55e">
      <rect x="176" y="546" width="24" height="24"/>
      <rect x="200" y="546" width="24" height="24"/>
      <rect x="200" y="522" width="24" height="24"/>
      <rect x="224" y="522" width="24" height="24"/>
    </g>
    <g fill="#3b82f6">
      <rect x="248" y="546" width="24" height="24"/>
      <rect x="248" y="522" width="24" height="24"/>
      <rect x="248" y="498" width="24" height="24"/>
      <rect x="272" y="546" width="24" height="24"/>
    </g>
    <g fill="#ef4444">
      <rect x="272" y="498" width="24" height="24"/>
      <rect x="296" y="498" width="24" height="24"/>
      <rect x="248" y="474" width="24" height="24"/>
      <rect x="272" y="474" width="24" height="24"/>
    </g>
    <g fill="#06b6d4">
      <rect x="80" y="474" width="24" height="24"/>
      <rect x="104" y="474" width="24" height="24"/>
      <rect x="128" y="474" width="24" height="24"/>
      <rect x="152" y="474" width="24" height="24"/>
    </g>
  </g>

  <!-- Sidebar mirrors the core ConsoleRenderer sections. -->
  <rect x="360" y="88" width="762" height="484" rx="3" fill="#111827" stroke="#d1d5db" stroke-width="4"/>
  <line x1="360" y1="146" x2="1122" y2="146" stroke="#d1d5db" stroke-width="2"/>
  <line x1="360" y1="242" x2="1122" y2="242" stroke="#d1d5db" stroke-width="2"/>
  <line x1="360" y1="390" x2="1122" y2="390" stroke="#d1d5db" stroke-width="2"/>

  <g fill="#f3f4f6" font-family="SFMono-Regular, Menlo, Consolas, monospace">
    <text x="741" y="125" text-anchor="middle" font-size="28" font-weight="700">SS004 TETRIS</text>
    <text x="390" y="181" font-size="21" font-weight="700">SCORE</text>
    <text x="390" y="220" font-size="30">1250</text>
    <text x="390" y="278" font-size="21" font-weight="700">NEXT PIECE</text>
    <text x="390" y="426" font-size="21" font-weight="700">CONTROLS</text>
    <text x="390" y="462" font-size="18">Left/Right : arrows or A/D</text>
    <text x="390" y="490" font-size="18">Soft drop  : down arrow or S</text>
    <text x="390" y="518" font-size="18">Rotate     : up arrow or W</text>
    <text x="390" y="546" font-size="18">Restart: R     Quit: Q</text>
  </g>

  <!-- Four-cell L preview centered in a logical 4 by 4 preview area. -->
  <g fill="#f97316">
    <rect x="700" y="290" width="28" height="28"/>
    <rect x="700" y="318" width="28" height="28"/>
    <rect x="728" y="346" width="28" height="28"/>
    <rect x="700" y="346" width="28" height="28"/>
  </g>
</svg>
